# تنظیمات پیشنهادی Nginx برای اتصال همزمان فرانت‌اند، پل Node (پورت 3000) و بک‌اند Django (پورت 8000)
# مسیر قرارگیری روی سرور: /etc/nginx/sites-available/tandiis.com

server {
    listen 80;
    server_name tandiis.com www.tandiis.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tandiis.com www.tandiis.com;

    # گواهی SSL موجود Certbot را حفظ کنید:
    ssl_certificate /etc/letsencrypt/live/tandiis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tandiis.com/privkey.pem;

    client_max_body_size 10M;

    # حالت به‌روزرسانی خودکار (در صورت وجود فایل پرچم maintenance.on)
    set $maintenance 0;
    if (-f /var/www/TandisWEB/maintenance.on) {
        set $maintenance 1;
    }

    error_page 503 @maintenance;
    location @maintenance {
        root /var/www/TandisWEB/deploy;
        rewrite ^(.*)$ /maintenance.html break;
    }

    # فایل‌های استاتیک دانلود اپلیکیشن و پنل ادمین Django مستقیماً روی پورت 8000
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /downloads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # تمام مسیرهای API وب‌سایت و پنل همکار (/api/tandis/*، /api/hamkar/*، /api/v1/*) -> سرور Node روی پورت 3000
    location ^~ /api/ {
        if ($maintenance = 1) { return 503; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # خود وب‌سایت (فرانت‌اند ساخته‌شده در dist با هدرهای ضدکش روی index.html و sw.js) -> سرور Node روی پورت 3000
    location / {
        if ($maintenance = 1) { return 503; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
