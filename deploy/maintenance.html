<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="15" />
    <title>تندیس | سایت در حال به‌روزرسانی است</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f2f9f9;
        color: #12292c;
        font-family: Tahoma, system-ui, -apple-system, sans-serif;
        padding: 20px;
      }
      .card {
        max-width: 460px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #dcecec;
        border-radius: 28px;
        padding: 36px 28px;
        text-align: center;
        box-shadow: 0 18px 46px rgba(11, 92, 96, 0.08);
      }
      .badge {
        display: inline-block;
        background: #fff8e1;
        color: #9a6700;
        border: 1px solid rgba(242, 169, 0, 0.4);
        border-radius: 12px;
        padding: 6px 14px;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 20px;
        color: #0b5c60;
      }
      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.9;
        color: #4f6b70;
      }
      .spinner {
        width: 36px;
        height: 36px;
        margin: 22px auto 0;
        border: 3px solid #dcecec;
        border-top-color: #0b5c60;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">سامانه جامع خدمات تندیس</div>
      <h1>سایت در حال به‌روزرسانی است</h1>
      <p>
        در حال ارتقای نسخه جدید وب‌سایت تندیس و پنل تندیس همکار هستیم.
        لطفاً چند لحظه شکیبا باشید؛ صفحه به‌صورت خودکار مجدداً بارگذاری می‌شود.
      </p>
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </body>
</html>
